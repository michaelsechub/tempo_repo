---
# A System groups the components and APIs that together deliver one capability.
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: customer-management
  title: Customer Management
  description: Create, search, update and delete customers.
  tags:
    - customer
spec:
  owner: user:tesfa
---

# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: addisGroup
spec:
  type: team
  children: []
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: Tesfa
spec:
  profile:
    displayName: Tesfa
  memberOf: [guests, newGroup]
---
# The service that runs the Customer Management API.
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: customer-service
  title: Customer Service
  description: Spring Boot service that implements the Customer Management REST API.
  tags:
    - spring-boot
    - rest
spec:j
  type: service
  lifecycle: production
  owner: user:tesfa
  system: customer-management
  # Defined in examples/apis/customer-api/catalog-info.yaml
  providesApis:
    - customer-api

  
